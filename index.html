<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fragments UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <h1>Fragments UI</h1>
    <section>
      <nav>
        <button id="login">Login</button>
      </nav>
    </section>
    <section hidden id="user">
      <h2>Welcome <span class="username"></span>!</h2>

      <h3>Create a Fragment</h3>
      <form id="create-form">
        <select id="fragment-type">
          <option value="text/plain">Plain Text</option>
          <option value="text/markdown">Markdown</option>
          <option value="text/html">HTML</option>
          <option value="text/csv">CSV</option>
          <option value="application/json">JSON</option>
          <option value="application/yaml">YAML</option>
        </select>
        <br />
        <textarea id="fragment-text" rows="4" cols="50" placeholder="Type your fragment here..."></textarea>
        <br />
        <label for="fragment-file">Or upload an image (overrides the text area above):</label>
        <br />
        <input type="file" id="fragment-file" accept="image/png,image/jpeg,image/webp,image/avif,image/gif" />
        <br />
        <button type="submit">Create Fragment</button>
      </form>

      <h3>Your Fragments</h3>
      <table id="fragments-table" border="1" cellpadding="6">
        <thead>
          <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Size</th>
            <th>Created</th>
            <th>Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="fragments-list"></tbody>
      </table>

      <button id="logout">Logout</button>
    </section>
  </body>
</html>
