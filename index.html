<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fragments UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="src/styles.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <i class="ti ti-stack-2" aria-hidden="true"></i>
        <span>Fragments</span>
      </div>
      <div class="header-actions">
        <span class="username-badge" id="username-badge" hidden>
          <i class="ti ti-user" aria-hidden="true"></i>
          <span class="username"></span>
        </span>
        <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
          <i class="ti ti-moon" aria-hidden="true"></i>
        </button>
        <button id="login">Login</button>
        <button id="logout" hidden>Logout</button>
      </div>
    </header>

    <section hidden id="user">
      <div class="panel">
        <h3>Create a fragment</h3>
        <form id="create-form">
          <div class="form-row">
            <select id="fragment-type">
              <option value="text/plain">Plain Text</option>
              <option value="text/markdown">Markdown</option>
              <option value="text/html">HTML</option>
              <option value="text/csv">CSV</option>
              <option value="application/json">JSON</option>
              <option value="application/yaml">YAML</option>
              <option value="application/xml">XML</option>
            </select>
            <input type="file" id="fragment-file" accept="image/png,image/jpeg,image/webp,image/avif,image/gif" />
          </div>
          <textarea id="fragment-text" rows="3" placeholder="Type your fragment here, or choose an image file above..."></textarea>
          <button type="submit">
            <i class="ti ti-plus" aria-hidden="true"></i>
            Create fragment
          </button>
        </form>
      </div>

      <h3>Your fragments</h3>
      <div id="fragments-list" class="fragments-grid"></div>
    </section>
  </body>
</html>
