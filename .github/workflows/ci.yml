# .github/workflows/ci.yml

# Runs the end-to-end tests on every push and pull request. They need no AWS and
# no backend: the UI is built with dummy Cognito settings and talks to a fake API
# inside the browser (see e2e/helpers.js).
name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install node dependencies
        run: npm ci

      # Downloads Chromium and the system libraries it needs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Builds the UI with dummy settings, serves it, runs the tests
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
